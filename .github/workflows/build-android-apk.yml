name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/flutter-casino-demo-1517

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create . --platforms=android --org com.sawfin

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FORCE_OFFLINE_DEMO=true \
            --dart-define=FIREBASE_ANDROID_API_KEY="${FIREBASE_ANDROID_API_KEY}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${FIREBASE_ANDROID_APP_ID}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET}"
        env:
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sawfin777-demo-install-ready.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawfin777-demo-install-ready-apk
          path: sawfin777-demo-install-ready.apk
          retention-days: 14
