<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order confirmed | Apex Bioreagents</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script>window.SITE_ACTIVE = "products";</script>
  <header class="site-header" id="site-header"></header>
  <main class="container content-page" id="order-confirm-root">
    <h1>Thank you for your order</h1>
    <p>Your purchase request has been received.</p>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var id = new URLSearchParams(location.search).get("order");
      var el = document.getElementById("order-confirm-root");
      if (id && el) {
        el.innerHTML =
          "<h1>Thank you for your order</h1>" +
          "<p>Order <strong>" + id + "</strong> is confirmed. A confirmation email will be sent with PO and shipping details.</p>" +
          '<p><a class="btn btn-primary" href="products.html">Continue shopping</a></p>';
      }
    });
  </script>
</body>
</html>
