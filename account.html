<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Apex Bioreagents</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="container content-page">
    <h1>Account sign in</h1>
    <form class="form-card" style="max-width:420px">
      <div class="form-group"><label>Email</label><input type="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" required></div>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p style="font-size:0.875rem;color:var(--color-ink-muted);margin-top:1rem;">Guest checkout is available — no account required to purchase.</p>
    </form>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
