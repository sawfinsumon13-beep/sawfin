<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Apex Bioreagents</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <script>window.SITE_ACTIVE = "about";</script>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="page-hero"><div class="container"><h1>Contact information</h1></div></div>
    <section class="section"><div class="container contact-layout">
      <aside class="contact-info-card">
        <h3>Sales</h3>
        <p><strong>Email:</strong> orders@apexbio.example<br><strong>Phone:</strong> +1 (800) 555-0142</p>
      </aside>
      <form class="form-card" id="contact-form">
        <div class="form-group"><label for="name">Name</label><input id="name" required></div>
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send</button>
        <p id="form-status" style="display:none;margin-top:1rem;"></p>
      </form>
    </div></section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
