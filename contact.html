<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | bmwusedengines</title>
  <meta name="description" content="Contact bmwusedengines in Hamburg. Email flashkingpro202@gmail.com or call +49 176 13627363 for engine quotes and technical advice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <div class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / <span>Contact Us</span></div>
      <h1>Contact Us</h1>
      <p>Get in touch with our technical team for engine quotes, fitment advice, or shipping enquiries.</p>
    </div>
  </div>

  <div class="container contact-grid">
    <div class="contact-info-card">
      <h3>Get In Touch</h3>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <div>
          <strong>Email</strong>
          <a href="mailto:flashkingpro202@gmail.com">flashkingpro202@gmail.com</a>
        </div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        <div>
          <strong>Phone</strong>
          <a href="tel:+4917613627363">+49 176 13627363</a>
        </div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div>
          <strong>Location</strong>
          <span>Hamburg, Germany</span>
        </div>
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <div>
          <strong>Business Hours</strong>
          <span>Monday – Friday, 08:00 – 18:00 CET</span>
        </div>
      </div>
    </div>

    <form class="contact-form" onsubmit="event.preventDefault();alert('Thank you! We will respond within 2 hours during business hours.');">
      <h3 style="margin-bottom:24px;font-size:1.1rem;font-weight:700">Send Us a Message</h3>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+49 ...">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject">
          <option>Engine Quote Request</option>
          <option>Fitment / Compatibility Question</option>
          <option>Shipping Enquiry</option>
          <option>M57 Swap Kit Information</option>
          <option>Warranty Claim</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" required placeholder="Tell us about your project — vehicle model, engine needed, delivery country..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Send Message</button>
    </form>
  </div>

  <div id="pageContent"></div>

  <div id="site-footer"></div>
  <script src="js/images.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/components.js"></script>
  <script src="js/page-content.js"></script>
</body>
</html>
