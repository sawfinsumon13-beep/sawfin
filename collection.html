<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection | Original Bavarian Engine</title>
    <meta
      name="description"
      content="Explore premium original old BMW engines across E30, E34, E36, E39, M Series, and rare Bavarian collections."
    />
    <link rel="icon" href="assets/images/logo-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              matte: "#111111",
              graphite: "#1F1F1F",
              silver: "#C8C8C8",
              accent: "#2E5BFF",
              cloud: "#F7F7F7"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </head>
  <body data-page="collection" class="page-shell antialiased">
    <div id="pageLoader" class="loader-overlay">
      <div class="text-center">
        <div class="loader-ring mx-auto"></div>
        <p class="mt-4 text-xs uppercase tracking-[0.3em] text-silver">Loading Collection</p>
      </div>
    </div>

    <div data-component="navbar"></div>

    <main class="px-4 pb-24 pt-32 md:px-8">
      <section class="mx-auto max-w-7xl rounded-[2rem] border border-[var(--border)] bg-[var(--bg-elevated)]/55 p-7 md:p-10">
        <p class="text-xs uppercase tracking-[0.3em] text-[var(--muted)]">Original Engine Inventory</p>
        <h1 class="mt-3 max-w-3xl text-4xl text-[var(--text)] md:text-5xl">BMW Vintage Engine Collection</h1>
        <p class="mt-4 max-w-2xl text-sm leading-relaxed text-[var(--muted)]">
          Browse verified original engines from BMW E30, E34, E36, E39, classic M Series, and rare Bavarian heritage
          stock. Each unit includes condition and mileage documentation.
        </p>
        <div class="mt-8 grid gap-4 md:grid-cols-3">
          <div class="md:col-span-2">
            <label for="collectionSearch" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]"
              >Engine Search</label
            >
            <input
              id="collectionSearch"
              type="search"
              placeholder="Search by engine code, year, or condition..."
              class="w-full rounded-full border border-[var(--border)] bg-transparent px-5 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
            />
          </div>
          <div>
            <label for="categoryFilter" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]"
              >Category</label
            >
            <select
              id="categoryFilter"
              class="w-full rounded-full border border-[var(--border)] bg-[var(--bg)] px-5 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
            ></select>
          </div>
        </div>
        <p id="collectionMeta" class="mt-5 text-sm text-[var(--muted)]">0 original engines found</p>
      </section>

      <section class="mx-auto mt-10 max-w-7xl">
        <div id="collectionGrid" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
