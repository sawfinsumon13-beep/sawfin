<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="titleBlog descBlog">
  <title id="titleBlog">SEO Blog Cover Visual</title>
  <desc id="descBlog">Abstract illustration used for SEO blog article cards.</desc>
  <defs>
    <linearGradient id="blogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1325"/>
      <stop offset="100%" stop-color="#1a3458"/>
    </linearGradient>
    <linearGradient id="blogStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="520" height="300" fill="url(#blogBg)"/>
  <rect x="56" y="52" width="408" height="196" rx="18" fill="#111827" stroke="url(#blogStroke)" stroke-opacity="0.6"/>
  <rect x="86" y="95" width="260" height="16" rx="8" fill="#1e3a8a"/>
  <rect x="86" y="128" width="320" height="16" rx="8" fill="#1d4ed8"/>
  <rect x="86" y="161" width="220" height="16" rx="8" fill="#2563eb"/>
  <circle cx="404" cy="156" r="36" fill="none" stroke="#06B6D4" stroke-width="10"/>
  <text x="86" y="74" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="18">SEO INSIGHTS</text>
</svg>
