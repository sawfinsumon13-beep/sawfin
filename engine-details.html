<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine Details | Original Bavarian Engine</title>
    <meta
      name="description"
      content="View complete specifications, compatibility, and condition reports for original vintage BMW engines."
    />
    <link rel="icon" href="assets/images/logo-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              matte: "#111111",
              graphite: "#1F1F1F",
              silver: "#C8C8C8",
              accent: "#2E5BFF",
              cloud: "#F7F7F7"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </head>
  <body data-page="details" class="page-shell antialiased">
    <div id="pageLoader" class="loader-overlay">
      <div class="text-center">
        <div class="loader-ring mx-auto"></div>
        <p class="mt-4 text-xs uppercase tracking-[0.3em] text-silver">Loading Engine Details</p>
      </div>
    </div>

    <div data-component="navbar"></div>

    <main class="px-4 pb-24 pt-32 md:px-8">
      <section class="mx-auto max-w-7xl">
        <p id="detailCategory" class="text-xs uppercase tracking-[0.3em] text-[var(--muted)]"></p>
        <div class="mt-3 flex flex-wrap items-end justify-between gap-6">
          <div>
            <p id="detailCode" class="text-sm text-[var(--accent-blue)]"></p>
            <h1 id="detailTitle" class="mt-2 text-4xl text-[var(--text)] md:text-5xl"></h1>
          </div>
          <p id="detailPrice" class="text-3xl font-semibold text-[var(--accent-blue)] md:text-4xl"></p>
        </div>
      </section>

      <section class="mx-auto mt-8 grid max-w-7xl gap-7 lg:grid-cols-[1.2fr_0.8fr]">
        <div class="space-y-4">
          <figure class="overflow-hidden rounded-3xl border border-[var(--border)]">
            <img
              id="detailMainImage"
              src=""
              alt="Selected engine image"
              class="h-[440px] w-full object-cover"
              fetchpriority="high"
            />
          </figure>
          <div id="detailThumbs" class="grid grid-cols-3 gap-3"></div>
        </div>

        <aside class="glass-card rounded-3xl p-6">
          <h2 class="text-xl text-[var(--text)]">Condition Summary</h2>
          <dl class="mt-5 grid grid-cols-2 gap-4 text-sm">
            <div>
              <dt class="text-xs uppercase tracking-[0.18em] text-[var(--muted)]">Condition</dt>
              <dd id="detailCondition" class="mt-1 text-[var(--text)]"></dd>
            </div>
            <div>
              <dt class="text-xs uppercase tracking-[0.18em] text-[var(--muted)]">Mileage</dt>
              <dd id="detailMileage" class="mt-1 text-[var(--text)]"></dd>
            </div>
            <div>
              <dt class="text-xs uppercase tracking-[0.18em] text-[var(--muted)]">Year</dt>
              <dd id="detailYear" class="mt-1 text-[var(--text)]"></dd>
            </div>
            <div>
              <dt class="text-xs uppercase tracking-[0.18em] text-[var(--muted)]">Availability</dt>
              <dd id="detailAvailability" class="mt-1 text-[var(--text)]"></dd>
            </div>
          </dl>
          <div id="detailsActions" class="mt-6 flex flex-wrap gap-3"></div>
          <a
            href="#quoteSection"
            class="btn-secondary mt-3 inline-flex rounded-full px-5 py-2 text-sm"
            >Request Quote Below</a
          >
        </aside>
      </section>

      <section class="mx-auto mt-10 grid max-w-7xl gap-7 lg:grid-cols-2">
        <article class="section-shell rounded-3xl p-6">
          <h2 class="text-2xl text-[var(--text)]">Specifications</h2>
          <div class="mt-4 overflow-hidden rounded-2xl border border-[var(--border)]">
            <table class="w-full border-collapse">
              <tbody id="specTable"></tbody>
            </table>
          </div>
        </article>

        <article class="section-shell rounded-3xl p-6">
          <h2 class="text-2xl text-[var(--text)]">Compatibility</h2>
          <ul id="compatibilityList" class="mt-4 space-y-3"></ul>
        </article>
      </section>

      <section class="mx-auto mt-8 grid max-w-7xl gap-7 lg:grid-cols-2">
        <article class="section-shell rounded-3xl p-6">
          <h2 class="text-2xl text-[var(--text)]">Shipping Details</h2>
          <p id="detailShipping" class="mt-3 text-sm leading-relaxed text-[var(--muted)]"></p>
        </article>
        <article class="section-shell rounded-3xl p-6">
          <h2 class="text-2xl text-[var(--text)]">Condition Report</h2>
          <p id="detailConditionReport" class="mt-3 text-sm leading-relaxed text-[var(--muted)]"></p>
        </article>
      </section>

      <section id="quoteSection" class="mx-auto mt-10 max-w-7xl">
        <div class="glass-card rounded-3xl p-8">
          <h2 class="text-3xl text-[var(--text)]">Request Quote</h2>
          <p class="mt-2 text-sm text-[var(--muted)]">
            Submit your workshop details and preferred delivery destination for a tailored quote.
          </p>
          <form id="requestQuoteForm" class="mt-6 grid gap-4 md:grid-cols-2">
            <input
              type="hidden"
              id="quoteEngineCode"
              name="engineCode"
              value=""
            />
            <div>
              <label for="quoteName" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]">Full Name</label>
              <input
                id="quoteName"
                name="name"
                type="text"
                required
                class="w-full rounded-2xl border border-[var(--border)] bg-transparent px-4 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
              />
            </div>
            <div>
              <label for="quoteEmail" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]">Email</label>
              <input
                id="quoteEmail"
                name="email"
                type="email"
                required
                class="w-full rounded-2xl border border-[var(--border)] bg-transparent px-4 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
              />
            </div>
            <div>
              <label for="quotePhone" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]">Phone</label>
              <input
                id="quotePhone"
                name="phone"
                type="tel"
                class="w-full rounded-2xl border border-[var(--border)] bg-transparent px-4 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
              />
            </div>
            <div>
              <label for="quoteCountry" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]"
                >Country</label
              >
              <input
                id="quoteCountry"
                name="country"
                type="text"
                required
                class="w-full rounded-2xl border border-[var(--border)] bg-transparent px-4 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
              />
            </div>
            <div class="md:col-span-2">
              <label for="quoteMessage" class="mb-2 block text-xs uppercase tracking-[0.2em] text-[var(--muted)]"
                >Project Details</label
              >
              <textarea
                id="quoteMessage"
                name="message"
                rows="5"
                required
                class="w-full rounded-2xl border border-[var(--border)] bg-transparent px-4 py-3 text-sm text-[var(--text)] outline-none transition focus:border-[var(--accent-blue)]"
                placeholder="Chassis model, restoration stage, requested timeline..."
              ></textarea>
            </div>
            <div class="md:col-span-2">
              <button type="submit" class="btn-primary rounded-full px-8 py-3 text-sm uppercase tracking-[0.15em]">
                Submit Request
              </button>
            </div>
          </form>
          <p id="quoteFormMessage" class="mt-3 text-sm text-[var(--accent-blue)]" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
