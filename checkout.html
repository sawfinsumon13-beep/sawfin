<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Checkout at Bavarian Engines — complete your BMW engine order with VIN verification and Hamburg export.">
  <title>Checkout | Bavarian Engines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

  <main>
    <section class="cart-hero-banner">
      <div class="container">
        <h1>Checkout</h1>
      </div>
    </section>

    <section class="checkout-page">
      <div class="container checkout-layout">
        <form class="checkout-form" id="checkout-form">
          <h2>Billing details</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="name">Full name *</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone / WhatsApp *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
              <label for="country">Country *</label>
              <input type="text" id="country" name="country" required>
            </div>
          </div>
          <div class="form-group">
            <label for="address">Workshop or delivery address</label>
            <textarea id="address" name="address" rows="3" placeholder="Street, city, postcode"></textarea>
          </div>
          <div class="form-group">
            <label for="vin">Vehicle VIN (recommended)</label>
            <input type="text" id="vin" name="vin" placeholder="17-character chassis number">
          </div>

          <h2 style="margin-top:2rem;">Payment</h2>
          <p class="checkout-payment-note">After you place the order we send a proforma invoice. Pay by <strong>SEPA bank transfer</strong>, <strong>SWIFT wire</strong>, or <strong>Zelle</strong>. Shipping is quoted once your VIN and suffix are confirmed.</p>

          <button type="submit" class="btn btn-checkout" style="margin-top:1.5rem;width:100%;max-width:360px;">Place order via WhatsApp</button>
        </form>

        <aside class="checkout-summary-card" id="checkout-summary">
          <p>Loading order…</p>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/cart-utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout-page.js"></script>
</body>
</html>
