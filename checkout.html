<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Apex Bioreagents</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="checkout">
  <script>window.SITE_ACTIVE = "products";</script>
  <header class="site-header" id="site-header"></header>
  <main class="container content-page checkout-page">
    <h1>Checkout</h1>
    <p class="checkout-note">Secure research reagent ordering. Payment is simulated in this demo — connect Stripe or your ERP for live charges.</p>
    <div class="checkout-layout">
      <form id="checkout-form" class="form-card checkout-form">
        <h2>Shipping &amp; billing</h2>
        <div class="form-row">
          <div class="form-group"><label for="co-first">First name</label><input id="co-first" name="first" required></div>
          <div class="form-group"><label for="co-last">Last name</label><input id="co-last" name="last" required></div>
        </div>
        <div class="form-group"><label for="co-org">Institution / company</label><input id="co-org" name="org" required></div>
        <div class="form-group"><label for="co-email">Email</label><input type="email" id="co-email" name="email" required></div>
        <div class="form-group"><label for="co-phone">Phone</label><input type="tel" id="co-phone" name="phone" required></div>
        <div class="form-group"><label for="co-address">Shipping address</label><textarea id="co-address" name="address" required></textarea></div>
        <h2>Payment</h2>
        <div class="form-group">
          <label for="co-card">Card number</label>
          <input id="co-card" name="card" inputmode="numeric" placeholder="4242 4242 4242 4242" required>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="co-exp">Expiry</label><input id="co-exp" name="exp" placeholder="MM/YY" required></div>
          <div class="form-group"><label for="co-cvc">CVC</label><input id="co-cvc" name="cvc" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Place order</button>
      </form>
      <aside class="checkout-summary form-card" id="checkout-summary"></aside>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/components.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
