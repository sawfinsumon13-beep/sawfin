<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Apex Bioreagents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="page-hero">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">Home</a> / Products</p>
        <h1 id="shop-title">All products</h1>
        <p>Recombinant peptides, proteins, antibodies, fibrils, kits, compounds, and coronavirus research tools.</p>
      </div>
    </div>
    <section class="section" style="padding-top:2rem;">
      <div class="container shop-layout">
        <aside id="shop-sidebar" aria-label="Categories"></aside>
        <div>
          <div class="shop-toolbar">
            <input type="search" id="shop-search" placeholder="Search by name, SKU, or category…" aria-label="Search products">
            <select id="shop-sort" aria-label="Sort products">
              <option value="name-asc">Name (A–Z)</option>
              <option value="name-desc">Name (Z–A)</option>
              <option value="sku">SKU</option>
            </select>
          </div>
          <p id="shop-meta" class="breadcrumb"></p>
          <div class="product-grid" id="product-grid"></div>
          <div id="shop-pager"></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
