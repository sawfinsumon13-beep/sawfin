<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BMW">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8edf2"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#b8c4d0"/>
      <stop offset="100%" stop-color="#8a96a4"/>
    </linearGradient>
    <linearGradient id="bmwBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b7de9"/>
      <stop offset="100%" stop-color="#0f4fa8"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app icon base -->
  <rect width="32" height="32" rx="8" fill="#f5f7fa"/>

  <!-- chrome outer ring -->
  <circle cx="16" cy="16" r="13" fill="url(#chrome)" stroke="#6b7785" stroke-width="0.5"/>
  <circle cx="16" cy="16" r="11.6" fill="#101820"/>

  <!-- inner roundel -->
  <clipPath id="roundel">
    <circle cx="16" cy="16" r="10.2"/>
  </clipPath>
  <g clip-path="url(#roundel)">
    <rect x="5.8" y="5.8" width="10.2" height="10.2" fill="#ffffff"/>
    <rect x="16" y="5.8" width="10.2" height="10.2" fill="url(#bmwBlue)"/>
    <rect x="5.8" y="16" width="10.2" height="10.2" fill="url(#bmwBlue)"/>
    <rect x="16" y="16" width="10.2" height="10.2" fill="#ffffff"/>
    <!-- quadrant cross -->
    <line x1="16" y1="5.8" x2="16" y2="26.2" stroke="#101820" stroke-width="0.9"/>
    <line x1="5.8" y1="16" x2="26.2" y2="16" stroke="#101820" stroke-width="0.9"/>
    <rect x="5.8" y="5.8" width="20.4" height="20.4" fill="url(#shine)"/>
  </g>

  <!-- inner bezel -->
  <circle cx="16" cy="16" r="10.2" fill="none" stroke="#101820" stroke-width="0.7"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.7"/>
</svg>
