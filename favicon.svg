<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BMW">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- favicon background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- BMW roundel outer ring -->
  <circle cx="16" cy="16" r="12.5" fill="url(#ring)" stroke="#1a1a1a" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="#3a3a3a" stroke-width="0.4" opacity="0.5"/>

  <!-- Bavarian blue & white quadrants -->
  <clipPath id="bmwInner">
    <circle cx="16" cy="16" r="9.8"/>
  </clipPath>
  <g clip-path="url(#bmwInner)">
    <rect x="6.2" y="6.2" width="9.8" height="9.8" fill="#f4f7fb"/>
    <rect x="16" y="6.2" width="9.8" height="9.8" fill="#1c69d4"/>
    <rect x="6.2" y="16" width="9.8" height="9.8" fill="#1c69d4"/>
    <rect x="16" y="16" width="9.8" height="9.8" fill="#f4f7fb"/>
    <!-- subtle quadrant shine -->
    <path d="M6.2 6.2 L16 16 L6.2 16 Z" fill="#ffffff" opacity="0.12"/>
    <path d="M25.8 25.8 L16 16 L25.8 16 Z" fill="#000000" opacity="0.08"/>
  </g>

  <!-- inner ring highlight -->
  <circle cx="16" cy="16" r="9.8" fill="none" stroke="#0d0d0d" stroke-width="0.7"/>

  <!-- BMW lettering on ring -->
  <path id="bmwTextPath" d="M 7.5 16 A 8.5 8.5 0 1 1 24.5 16" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="4.2" font-weight="700" fill="#e8eef7" letter-spacing="1.8">
    <textPath href="#bmwTextPath" startOffset="50%" text-anchor="middle">BMW</textPath>
  </text>
</svg>
