<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Bavarian Engines cart — reviewed BMW motors with VIN verification before checkout.">
  <title>Cart | Bavarian Engines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

  <main>
    <section class="cart-hero-banner">
      <div class="container">
        <h1>Cart</h1>
      </div>
    </section>

    <section class="cart-page">
      <div class="container cart-layout">
        <div class="cart-items-col">
          <div class="cart-table-head">
            <span>Product</span>
            <span>Total</span>
          </div>
          <div id="cart-items" aria-live="polite">
            <p class="cart-loading">Loading cart…</p>
          </div>
        </div>
        <aside class="cart-totals-col" id="cart-totals"></aside>
      </div>
    </section>
  </main>

  <script src="js/cart-utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
